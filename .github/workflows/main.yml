name: Validate and Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Check runtime syntax
        run: |
          node --check bin/kokoreader.js
          node --check extension/extension.js
          python3 -m py_compile python/kokoro_worker.py

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: vsce package --out kokoreader.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: kokoreader-vsix
          path: kokoreader.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p \"require('./package.json').version\")"

      - uses: actions/download-artifact@v4
        with:
          name: kokoreader-vsix
          path: release

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v version="$VERSION" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: release/kokoreader.vsix
