name: Re-validate and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Check runtime syntax
        run: |
          node --check bin/kokoreader.js
          node --check extension/extension.js
          python3 -m py_compile python/kokoro_worker.py

      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      - name: Package extension
        run: vsce package --out kokoreader.vsix

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kokoreader-vsix
          path: kokoreader.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kokoreader-vsix
          path: release

      - name: Verify Open VSX publishing access
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 verify-pat openlines

      - name: Publish validated VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish release/kokoreader.vsix --skip-duplicate

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v version="$VERSION" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: release/kokoreader.vsix
